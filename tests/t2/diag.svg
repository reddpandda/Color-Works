<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150">
<style>
rect{fill:#eee}
text{font:14px sans-serif;fill:#444}
.d,.l,.c,.f{display:none}
@media (prefers-color-scheme: dark){.d{display:inline} rect{fill:#222} text{fill:#ddd}}
@media (prefers-color-scheme: light){.l{display:inline}}
@media (prefers-contrast: more){.c{display:inline}}
@media (forced-colors: active){.f{display:inline}}
</style>
<rect width="300" height="150"/>
<text class="d" x="10" y="25">scheme: dark</text>
<text class="l" x="10" y="50">scheme: light</text>
<text class="c" x="10" y="75">contrast: more</text>
<text class="f" x="10" y="100">forced-colors</text>
<text x="10" y="130">end</text>
</svg>
